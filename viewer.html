<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAKTO 3D Workspace</title><style>body{margin:0;background:#0b1018;color:#e9edf4;font:14px system-ui}header{padding:18px 24px;border-bottom:1px solid #273445;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}a{color:#8ee3bd}main{display:grid;grid-template-columns:260px 1fr;min-height:85vh}aside{padding:20px;background:#141e2b}label{display:block;margin:20px 0}input,button{width:100%;padding:12px;border:1px solid #465367;border-radius:8px;background:#202c3c;color:white}canvas{display:block;width:100%;height:80vh}p{color:#9caec2;line-height:1.6}@media(max-width:700px){main{display:block}canvas{height:60vh}}</style></head><body><header><b>◇ MAKTO / 3D WORKSPACE</b><a href="engine.html">← Engineering Cockpit</a></header><main><aside><h2>Model inspector</h2><p>Inspect local STL geometry. Drag to orbit, scroll or pinch to zoom.</p><label>Load STL file<input id="file" type="file" accept=".stl"></label><button id="reset">Reset view</button><p id="status">Loading 3D viewer...</p><p>Visualization only. Not a structural simulation, CAD editor, or manufacturing validation.</p></aside><div id="scene"></div></main><script type="module">import * as THREE from 'https://esm.sh/three@0.170.0';import {OrbitControls} from 'https://esm.sh/three@0.170.0/examples/jsm/controls/OrbitControls.js';import {STLLoader} from 'https://esm.sh/three@0.170.0/examples/jsm/loaders/STLLoader.js';const host=document.querySelector('#scene'),status=document.querySelector('#status');const scene=new THREE.Scene();scene.background=new THREE.Color(0x0b1018);const camera=new THREE.PerspectiveCamera(50,1,.01,10000);camera.position.set(3,3,5);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));host.appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;scene.add(new THREE.HemisphereLight(0xffffff,0x344255,2));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(4,6,5);scene.add(light);scene.add(new THREE.GridHelper(10,20,0x45566b,0x273445));let mesh;function resize(){const w=host.clientWidth,h=Math.max(host.clientHeight,350);renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}window.addEventListener('resize',resize);resize();function show(g){if(mesh){scene.remove(mesh);mesh.geometry.dispose();mesh.material.dispose()}g.computeVertexNormals();g.computeBoundingBox();const b=g.boundingBox,center=b.getCenter(new THREE.Vector3()),size=b.getSize(new THREE.Vector3());g.translate(-center.x,-center.y,-center.z);const max=Math.max(size.x,size.y,size.z)||1;mesh=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:0x76d9b3,metalness:.25,roughness:.5,side:THREE.DoubleSide}));scene.add(mesh);camera.position.set(max*1.5,max*1.1,max*1.8);camera.near=Math.max(max/1000,.001);camera.far=max*1000;camera.updateProjectionMatrix();controls.target.set(0,0,0);controls.update();status.textContent='Loaded geometry · '+g.getAttribute('position').count/3+' triangles'}show(new THREE.BoxGeometry(1.8,1.2,1));status.textContent='Demo geometry loaded';document.querySelector('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>30e6){status.textContent='File too large (30 MB max)';return}try{const buffer=await f.arrayBuffer();show(new STLLoader().parse(buffer));status.textContent=f.name+' · '+status.textContent}catch{status.textContent='Unable to read STL file'}};document.querySelector('#reset').onclick=()=>{camera.position.set(3,3,5);controls.target.set(0,0,0);controls.update()};function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();</script></body></html>
